# Mini Rack Planner: static SPA on nginx-unprivileged (uid 101, port 8080).
# Runs with a read-only root filesystem; nginx only writes to /tmp (pid + temp paths in the base image).
# Security headers live in the generated snippet (scripts/headers.ts -> nginx/security-headers.conf).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  # Relative redirects keep the right host and port behind reverse proxies and Docker port maps.
  absolute_redirect off;

  # nginx >= 1.29.3: a location that sets its own add_header (Cache-Control below) still gets the
  # server-level security headers, so the snippet is included once instead of in every location.
  add_header_inherit merge;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml
    application/manifest+json application/wasm;

  # Hashed build output: cache forever. A missing chunk must be a real 404, never index.html,
  # otherwise a tab left open across a deploy would try to run HTML as JavaScript.
  # No `always` on Cache-Control here, so a 404 is never cached as immutable.
  location ^~ /assets/ {
    try_files $uri @missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # The stock mime.types has no .webmanifest entry. A types block replaces the inherited map,
  # so it is scoped to this location only.
  location ~* \.webmanifest$ {
    types {
      application/manifest+json webmanifest;
    }
    try_files $uri @missing;
    add_header Cache-Control "no-cache";
  }

  # Unhashed files at the root (favicon.svg, theme-init.js, ...) revalidate on every load. As with
  # SWA's navigationFallback.exclude, a missing file is a 404 rather than the SPA shell.
  location ~* \.(?:js|mjs|css|map|json|svg|png|ico|txt|wasm|woff2?)$ {
    try_files $uri @missing;
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (deep links such as /plan/abc) fall back to the SPA shell.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  location @missing {
    # Empty types map: the body is plain text even when the URL ends in .js.
    types {}
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 404 "Not found\n";
  }
}
