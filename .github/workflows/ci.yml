name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required status check for merging (branch protection: "build").
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Refuse committed model files
        run: |
          models=$(git ls-files | grep -iE '\.(stl|3mf|step|stp|zip|gcode)$' || true)
          if [ -n "$models" ]; then
            echo "::error::Model files must never be committed (designer licences, MakerWorld terms). Remove them from git:"
            echo "$models"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --format github

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Unit and property tests
        run: npm test

      - name: Security headers match scripts/headers.ts
        run: npm run headers -- --check

      # --check: validate only, and fail if ids.lock or catalog/schema were not regenerated.
      - name: Validate the catalog
        run: npm run validate-catalog -- --check

      - name: Build
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Bundle budgets
        run: npm run check-budgets

  # Builds the production image once and runs the E2E suite against it, read-only like production.
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mini-rack-planner:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-e2e
          cache-to: type=gha,mode=max,scope=ci-e2e

      - name: Start the container (read-only root filesystem)
        run: docker run -d --name mrp --read-only --tmpfs /tmp -p 8080:8080 mini-rack-planner:ci

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs mrp
          exit 1

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # On a cache hit this only installs the OS packages Chromium needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E against the container
        run: npm run e2e -- --project=prod-secure --project=prod-lan --project=mobile
        env:
          BASE_URL: http://localhost:8080
          GIT_SHA: ${{ github.sha }}

      - name: Container logs
        if: failure()
        run: docker logs mrp

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
