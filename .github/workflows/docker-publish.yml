name: Docker image

# main  -> ghcr.io/npab19/mini-rack-planner:edge and :sha-<short>
# v*    -> :X.Y.Z, :X.Y and :latest
# Tags created by release-please only start this workflow when it runs with a PAT
# (secret RELEASE_PLEASE_TOKEN); otherwise run it by hand on the tag (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Registry paths must be lower case; GitHub owner names may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mini-rack-planner" >> "$GITHUB_OUTPUT"

      # No QEMU: the build stage runs on the runner's own platform and the runtime stage only
      # copies files, so building linux/arm64 and linux/arm/v7 needs no emulation.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR shows the description from the multi-arch index, so annotate it too.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Mini Rack Planner
            org.opencontainers.image.description=Browser-only planner for 3D-printed 10-inch homelab racks: layout, 3D preview and a shopping list.
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Mini Rack Planner
            org.opencontainers.image.description=Browser-only planner for 3D-printed 10-inch homelab racks: layout, 3D preview and a shopping list.
            org.opencontainers.image.licenses=MIT

      - name: Build and push (amd64, arm64, arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          # GitHub Actions cache only: a registry cache with mode=max would push cache blobs to GHCR.
          cache-from: type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish
