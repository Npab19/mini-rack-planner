name: Azure Static Web Apps

# push to main      -> "staging" environment
# push of a v* tag  -> production
# PR from this repo -> its own preview environment, closed when the PR closes
# Fork PRs get no secrets, so they never deploy. Setup: docs/deploy.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    name: build and deploy
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the deploy action comments the preview URL on the PR
    steps:
      - name: Check for the deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so nothing was deployed. See docs/deploy.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Deploy the prebuilt dist/
        id: deploy
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          # Empty means production for pushes; pull requests always get their own preview.
          deployment_environment: ${{ github.ref == 'refs/heads/main' && 'staging' || '' }}

      - name: Check headers and routing on the deployed site
        if: steps.token.outputs.present == 'true'
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -eu
          if [ -z "$SITE_URL" ]; then
            echo "::error::The deploy step returned no URL."
            exit 1
          fi
          site="${SITE_URL%/}"
          expected_csp=$(node -p "require('./dist/staticwebapp.config.json').globalHeaders['Content-Security-Policy']")
          asset=$(grep -o -m 1 '/assets/index-[^"]*\.js' dist/index.html || true)
          if [ -z "$asset" ]; then
            echo "::error::dist/index.html references no /assets/index-*.js entry script"
            exit 1
          fi

          # Value of one response header (case-insensitive name), or empty.
          header() { printf '%s\n' "$1" | grep -i -m 1 "^$2:" | cut -d: -f2- | sed 's/^ *//'; }

          for path in / /plan/deploy-check "$asset"; do
            # A new deployment can take a moment to reach every edge node.
            raw=$(curl -fsS -D - -o /dev/null --retry 6 --retry-delay 10 --retry-all-errors "$site$path")
            headers=$(printf '%s' "$raw" | tr -d '\r')
            csp=$(header "$headers" content-security-policy)
            if [ "$csp" != "$expected_csp" ]; then
              echo "::error::$site$path: Content-Security-Policy is '${csp:-missing}', expected the value generated by scripts/headers.ts"
              exit 1
            fi
            if [ "$(header "$headers" x-content-type-options)" != "nosniff" ]; then
              echo "::error::$site$path: X-Content-Type-Options: nosniff is missing"
              exit 1
            fi
            echo "OK  $site$path"
          done

          status=$(curl -sS -o /dev/null -w '%{http_code}' "$site/assets/does-not-exist.js")
          if [ "$status" != "404" ]; then
            echo "::error::$site/assets/does-not-exist.js returned $status; a missing asset must be a 404, not the SPA shell"
            exit 1
          fi
          echo "OK  $site/assets/does-not-exist.js is 404"

  close_pull_request_job:
    name: close PR preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Close the preview environment
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist
